name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    name: 静态闸门（typecheck + build + test + Node16 API 锁）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # 闸门不含游戏启动、不依赖版权资产；CI 无需 electron 二进制
      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      # 版本单一源绊线（PR 面）：内嵌面（tauri conf / 两 electron 壳）必须等于根 version；
      # tag==根 的对账在 release.yml gates（ci 无 tag 语境）。
      - name: Version single-source check
        run: pnpm run version:check

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Build
        run: pnpm -r build

      - name: Contract tests (TS)
        run: pnpm -r test

      # 契约面漂移 = fixture 与提交态不一致（sidecar 导出表为数据源）
      - name: Contract fixtures in sync
        run: pnpm run fixtures:check

      # 兜底线（Electron 22 = Node 16.17）宿主面 API 锁
      - name: Node16 API gate
        run: pnpm run gate:node16

  rust-contract:
    name: 契约测试 Rust 侧（cargo test，Windows 原生 arch）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (skip electron binaries)
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Build (sidecar dist for fixtures)
        run: pnpm -r build

      - name: Regenerate contract fixtures
        run: pnpm run fixtures

      # 3m+ 大头 = 冷缓存（每次全量重下重编 ~400 依赖，2026-10-26 用户 CI 观察）；
      # rust-cache 命中 registry+target 后，Rust/lockfile 零变化的 run 降到秒级
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/tauri/src-tauri

      - name: Cargo contract tests
        run: cargo test --manifest-path apps/tauri/src-tauri/Cargo.toml

  # 更新脚本对冒烟（plan「测试版通道与更新执行面」执行面 2026-11-07）：
  # 快路径文件系统腿（验→解→等→换→启）用假 install + 假 zip 全跑通——
  # bat 拉起的仍是真 powershell 5.1（BOM/只读变量等 PS5 坑在此绊住），pwsh 只做 CI 胶水。
  update-script-smoke:
    name: 更新脚本对冒烟（快路径换体腿）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 假构件 + 换体断言
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $install = Join-Path $env:RUNNER_TEMP 'attic-fake-install'
          if (Test-Path $install) { Remove-Item $install -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $install | Out-Null
          Copy-Item scripts/attic-update.ps1, scripts/attic-update.bat $install
          # 旧体 = ping.exe 冒充主程序；version.txt 三行锚与 release.yml portable 出厂面同构
          Copy-Item "$env:SystemRoot\System32\ping.exe" (Join-Path $install 'Attic.exe')
          Set-Content -Path (Join-Path $install 'version.txt') -Value "version=0.0.0`nexe=Attic.exe`nrepo=a/b" -Encoding ascii
          # 假构件 zip：顶层版本目录（打包面同构）；新体 = where.exe（无参即退，不残留进程）
          $payload = Join-Path $env:RUNNER_TEMP 'attic-fake-payload\attic-tauri-windows-x64-9.9.9'
          New-Item -ItemType Directory -Force -Path $payload | Out-Null
          Copy-Item "$env:SystemRoot\System32\where.exe" (Join-Path $payload 'Attic.exe')
          Set-Content -Path (Join-Path $payload 'marker.txt') -Value 'new-body'
          $zip = Join-Path $env:RUNNER_TEMP 'attic-fake.zip'
          Compress-Archive -Path $payload -DestinationPath $zip
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          $pingHash = (Get-FileHash "$env:SystemRoot\System32\ping.exe").Hash
          # 反例：digest 不符 = 失败退出且旧体原封不动（WaitPid 用不存在 PID = 等待立即通过）
          & (Join-Path $install 'attic-update.bat') -Zip $zip -WaitPid 4194304 -Sha256 ('f' * 64) | Out-Null
          if ($LASTEXITCODE -eq 0) { throw 'digest 不符应失败' }
          if ((Get-FileHash "$install\Attic.exe").Hash -ne $pingHash) { throw '失败路径动了旧体' }
          # 正例：换体成功 + 脚本对/版本锚幸存（/XF 排除面）
          & (Join-Path $install 'attic-update.bat') -Zip $zip -WaitPid 4194304 -Sha256 $sha
          if ($LASTEXITCODE -ne 0) { throw "换体腿失败 exit=$LASTEXITCODE" }
          if (-not (Test-Path "$install\marker.txt")) { throw '新体未落位（marker 缺失）' }
          if ((Get-FileHash "$install\Attic.exe").Hash -eq $pingHash) { throw '主程序仍是旧体' }
          foreach ($keep in 'attic-update.ps1', 'attic-update.bat', 'version.txt') {
            if (-not (Test-Path (Join-Path $install $keep))) { throw "换体自我清除：$keep 缺失" }
          }
          Write-Host '[smoke] 更新脚本对换体腿通过'
